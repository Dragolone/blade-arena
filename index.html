<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>刀锋竞技场 · BLADE ARENA</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game"></div>

<!-- ============ HUD ============ -->
<div id="hud" class="hidden">
  <div id="vig"></div><div id="lowhp"></div><div id="pick"></div>
  <div id="scope"><div class="sc-ring"></div><i class="h"></i><i class="v"></i></div>
  <div id="cross"><i></i><i></i><i></i><i></i><b></b></div>
  <div id="hit"></div>
  <div id="dmgdir"></div>
  <div id="nums"></div>

  <div id="top">
    <div class="pill"><span class="lbl" data-i18n="wave">波次</span><span id="wave">1</span></div>
    <div class="pill"><span class="lbl" data-i18n="enemiesLeft">剩余敌人</span><span id="left">0</span></div>
    <div class="pill gold"><span class="lbl" data-i18n="score">得分</span><span id="score">0</span></div>
  </div>
  <div id="combo"></div>
  <div id="boss"><div id="bossname"></div><div class="bar"><div id="bossbar"></div></div></div>
  <div id="feed"></div>
  <div id="banner"></div>

  <div id="hpbox">
    <div class="row"><span class="ico">✚</span><span id="hp">1000</span><div class="bar"><div id="hpbar"></div></div></div>
    <div class="row small"><span class="ico">⛨</span><span id="armor">0</span><div class="bar"><div id="armorbar"></div></div></div>
    <div id="perkbar"></div>
  </div>
  <div id="ammobox">
    <div id="wname">AK-47</div>
    <div><span id="mag">30</span><span id="res">/ 120</span></div>
    <div id="nades"></div>
  </div>
  <div id="slots"></div>
  <div id="hint" data-i18n="hint"></div>

  <div id="perkpick" class="hidden">
    <h2 data-i18n="perkTitle"></h2>
    <div id="perkcards"></div>
    <p data-i18n-html="perkKeys"></p>
  </div>
</div>

<!-- ============ 主菜单 / 军械库 ============ -->
<div id="menu">
  <div class="panel left">
    <h1 data-i18n="title">刀锋竞技场</h1>
    <div class="sub" data-i18n="subtitle">BLADE ARENA</div>
    <button id="btn-start" class="big" data-i18n="start">开始游戏</button>
    <div class="best"><span data-i18n="bestScore">最高分</span> <b id="best">0</b>　<span data-i18n="bestWave">最高波次</span> <b id="bestwave">0</b></div>
    <h3 data-i18n="armory">军械库</h3>
    <div id="wtabs"></div>
    <h3 data-i18n="settings">设置</h3>
    <label><span class="lt" data-i18n="sens">鼠标灵敏度</span> <span id="sens-v">1.0</span><input id="sens" type="range" min="0.2" max="3" step="0.05" value="1"></label>
    <label><span class="lt" data-i18n="volume">音量</span> <span id="vol-v">60</span><input id="vol" type="range" min="0" max="100" step="1" value="60"></label>
    <label><span class="lt">语言 / Language</span>
      <select id="lang"><option value="zh">中文</option><option value="en">English</option></select>
    </label>
    <label><span class="lt" data-i18n="difficulty">难度</span>
      <select id="difficulty"><option value="casual"></option><option value="normal"></option><option value="hard"></option></select>
    </label>
    <div id="diff-desc" class="diffdesc"></div>
    <label><span class="lt" data-i18n="quality">画质</span>
      <select id="quality"><option value="ultra" data-i18n="qUltra"></option><option value="high" data-i18n="qHigh"></option><option value="mid" data-i18n="qMid"></option><option value="low" data-i18n="qLow"></option></select>
    </label>
  </div>
  <div class="panel right">
    <div id="ktabs"></div>
    <h3 id="skin-title"></h3>
    <div id="skins"></div>
  </div>
  <div class="bottom">
    <div class="keys" data-i18n-html="keys"></div>
    <div class="tip" data-i18n="tip"></div>
  </div>
</div>

<div id="pause" class="overlay hidden">
  <div class="box">
    <h2 data-i18n="paused"></h2>
    <button id="btn-resume" class="big" data-i18n="resume"></button>
    <button id="btn-quit" data-i18n="toArmory"></button>
  </div>
</div>

<div id="over" class="overlay hidden">
  <div class="box">
    <h2 id="over-title"></h2>
    <div id="stats"></div>
    <button id="btn-again" class="big" data-i18n="again"></button>
    <button id="btn-menu" data-i18n="toArmory"></button>
  </div>
</div>

<div id="loading">加载中 · Loading…</div>
<script src="dist/game.js"></script>
</body>
</html>
